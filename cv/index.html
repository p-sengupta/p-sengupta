<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pritha Sengupta</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/cv.css">
</head>
<body>
    <div id="dark-mode-container"></div>
    <div id="navigation-container"></div>

    <div class="cv-page">
        <div class="pdf-viewer">
            <iframe
                src="https://drive.google.com/file/d/15KBMnhpnOWrSFJtsfVmknc7ro_OlCm3E/preview"
                title="Pritha Sengupta Curriculum Vitae"
                allow="autoplay">
            </iframe>
        </div>
    </div>

    <script src="../js/navigation.js"></script>
    <script>
        // Initialize navigation and dark mode for CV page
        document.addEventListener('DOMContentLoaded', function() {
            const darkModeContainer = document.getElementById('dark-mode-container');
            darkModeContainer.appendChild(createDarkModeToggle());
            
            const navContainer = document.getElementById('navigation-container');
            navContainer.appendChild(createNavigation('cv'));
            
            initNavigation();
            initDarkMode();
        });
    </script>
</body>
</html>
